name: doctor_web
description: "Web bác sĩ của MedicApp: hàng chờ, tóm tắt trước khám, tuân thủ thuốc, kê đơn."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  http: ^1.6.0
  intl: ^0.20.3
  lucide_icons_flutter: ^3.1.25
  medic_core:
    path: ../packages/medic_core
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/tinos/
    - assets/fonts/dejavu/LICENSE.txt
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
    # ✓ of the adherence strip (Be Vietnam Pro has no U+2713); keeps the web
    # from downloading a Noto fallback from Google (CSP connect-src 'self').
    - family: DejaVuCheck
      fonts:
        - asset: assets/fonts/dejavu/DejaVuSans-Check.ttf
    - family: Tinos
      fonts:
        - asset: assets/fonts/tinos/Tinos-Regular.ttf
        - asset: assets/fonts/tinos/Tinos-Bold.ttf
          weight: 700
        - asset: assets/fonts/tinos/Tinos-Italic.ttf
          style: italic
        - asset: assets/fonts/tinos/Tinos-BoldItalic.ttf
          weight: 700
          style: italic
